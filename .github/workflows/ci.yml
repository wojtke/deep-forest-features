name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - if: runner.os == 'macOS'
        run: brew install libomp  # LightGBM needs OpenMP on macOS
      - run: uv sync --locked
      - run: uv run pytest
