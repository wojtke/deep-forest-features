[project]
name = "dfx"
version = "0.1.0"
description = "Experiments for 'Non-linear and Interaction Features for Deep Forest'"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "lightgbm>=4.5",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "scikit-learn>=1.6",
    "scipy>=1.13",
    "threadpoolctl>=3.5",
    "xlrd>=2.0",
]

[project.scripts]
dfx = "dfx.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
